[package]
name = "ngos-capability"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
sel4-sys = { path = "../sel4-sys" }
alloc = { package = "alloc", version = "1.80" }
spin = "0.9"
bitflags = "2.5"
anyhow = "1.0"
thiserror = "1.0"
capnp = { version = "0.17", features = ["alloc"] }

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
opt-level = "z"
strip = true