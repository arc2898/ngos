[package]
name = "ngos-sel4-sys"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
core = { package = "core", version = "1.80" }
compiler_builtins = { version = "0.1" }
bitflags = "2.5"
x86_64 = "0.16"

[features]
default = []
kernel_mcs = []

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
opt-level = "z"
strip = true