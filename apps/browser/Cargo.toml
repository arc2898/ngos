[package]
name = "ngos-browser"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
capability = { path = "../../../libs/capability" }
sel4-sys = { path = "../../../libs/sel4-sys" }
tahoe-ui = { path = "../../../libs/tahoe-ui" }
wasm-runtime = { path = "../../../libs/wasm-runtime" }
alloc = { package = "alloc", version = "1.80" }
spin = "0.9"
hashbrown = "0.14"
anyhow = "1.0"
thiserror = "1.0"
ash = { version = "0.37", features = ["alloc"] }

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
opt-level = "z"
strip = true